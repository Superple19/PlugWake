[project]
name = "remotepc"
version = "0.1.0"
description = "Remote PC power controls using Home Assistant, SSH, and RDP."
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
  "PySide6==6.11.1",
]

[project.scripts]
remotepc = "remotepc.gui:main"
remotepc-cli = "remotepc.cli:main"

[build-system]
requires = ["uv_build>=0.8.0,<0.9.0"]
build-backend = "uv_build"
