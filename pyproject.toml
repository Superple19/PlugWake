[project]
name = "plugwake"
version = "0.1.0"
description = "Wake and shut down a remote PC through a Home Assistant smart plug."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10,<3.15"
dependencies = [
  "paramiko>=5.0.0",
  "PySide6==6.11.1",
]

[project.scripts]
plugwake = "plugwake.gui:main"
plugwake-cli = "plugwake.cli:main"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

[build-system]
requires = ["uv_build>=0.8.0,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.0",
]
